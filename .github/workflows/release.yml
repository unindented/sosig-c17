name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
      target_count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Single source of truth for release targets: the package matrix and the archive-count check
      # below both derive from this output.
      - name: Enumerate release targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          matrix='{"include":[{"target":"x86_64-linux-musl","runner":"ubuntu-latest"},{"target":"aarch64-linux-musl","runner":"ubuntu-latest"},{"target":"aarch64-macos","runner":"macos-26"}]}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$matrix" | jq '.include | length')" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw_version="$INPUT_VERSION"
          else
            raw_version="$REF_NAME"
          fi

          tag="$raw_version"
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac

          if ! [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "version must match vMAJOR.MINOR.PATCH with an optional prerelease suffix" >&2
            exit 1
          fi

          git fetch --force --depth=1 origin "refs/tags/$tag:refs/tags/$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - resolve
      - ci
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install QEMU
        if: matrix.target == 'aarch64-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Build package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: scripts/package-release.sh "$TARGET" "$VERSION"

      - name: Smoke test packaged binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/release/$VERSION/sosig-$VERSION-$TARGET.tar.gz"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          tar -C "$tmp" -xzf "$archive"
          bin="$tmp/sosig-$VERSION-$TARGET/sosig"
          # Every fixture site the Makefile golden targets cover, built here by the packaged binary
          # instead of a locally compiled one.
          for fixture in tests/fixtures/*; do
            site=$(basename "$fixture")
            mkdir -p "$tmp/$site"
            cp -R "$fixture/." "$tmp/$site/"
            case "$TARGET" in
              aarch64-linux-musl)
                (cd "$tmp/$site" && qemu-aarch64 "$bin" build)
                ;;
              *)
                (cd "$tmp/$site" && "$bin" build)
                ;;
            esac
            diff -ru "tests/expected/$site" "$tmp/$site/public"
          done

      - name: Verify archive contents
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          root="sosig-$VERSION-$TARGET"
          tar -tzf "dist/release/$VERSION/$root.tar.gz" > contents.txt
          grep -Fx "$root/sosig" contents.txt
          grep -Fx "$root/README.md" contents.txt
          grep -Fx "$root/LICENSE.txt" contents.txt
          grep -Fx "$root/THIRD_PARTY_NOTICES.md" contents.txt

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/release/${{ needs.resolve.outputs.version }}/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - package
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_COUNT: ${{ needs.resolve.outputs.target_count }}
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          archives=(sosig-"$VERSION"-*.tar.gz)
          if [ "${#archives[@]}" -ne "$TARGET_COUNT" ]; then
            echo "expected $TARGET_COUNT release archives, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          sha256sum -- "${archives[@]}" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --clobber \
              artifacts/*.tar.gz \
              artifacts/SHA256SUMS
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --verify-tag \
              artifacts/*.tar.gz \
              artifacts/SHA256SUMS
          fi
