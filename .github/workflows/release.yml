name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.targets.outputs.matrix }}
      target_count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Single source of truth for release targets: the package matrix and the archive-count check
      # below both derive from this output.
      - name: Enumerate release targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          matrix='{"include":[{"target":"x86_64-linux-musl","runner":"ubuntu-latest","preset":"release-linux-x86_64"},{"target":"aarch64-linux-musl","runner":"ubuntu-latest","preset":"release-linux-aarch64"},{"target":"aarch64-macos","runner":"macos-26","preset":"release"}]}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$matrix" | jq '.include | length')" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw_version="$INPUT_VERSION"
          else
            raw_version="$REF_NAME"
          fi

          tag="$raw_version"
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac

          if ! [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "version must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          git fetch --force --depth=1 origin "refs/tags/$tag:refs/tags/$tag"

          project_version=$(git show "$tag:CMakeLists.txt" | sed -n 's/^ *VERSION \([0-9][0-9.]*\) *$/\1/p')
          if [ "$project_version" != "${tag#v}" ]; then
            echo "tag $tag does not match project(VERSION $project_version) in CMakeLists.txt" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - resolve
      - ci
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install QEMU
        if: matrix.target == 'aarch64-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Install LLVM binutils
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Check native macOS host
        if: matrix.target == 'aarch64-macos'
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != "Darwin" ] || [ "$(uname -m)" != "arm64" ]; then
            echo "aarch64-macos packages must be built on an arm64 macOS host" >&2
            exit 1
          fi

      - name: Build package
        env:
          PRESET: ${{ matrix.preset }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cmake --preset "$PRESET" -DSOSIG_RELEASE_TARGET="$TARGET"
          cmake --build --preset "$PRESET"
          cpack --preset "$PRESET"

      - name: Smoke test packaged binary
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          archive="build/$PRESET/sosig-$VERSION-$TARGET.tar.gz"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          tar -C "$tmp" -xzf "$archive"
          bin="$tmp/sosig-$VERSION-$TARGET/bin/sosig"
          # Every fixture site in the golden test suite, built by the installed binary rather than
          # a build-tree binary.
          for fixture in tests/fixtures/*; do
            site=$(basename "$fixture")
            mkdir -p "$tmp/$site"
            cp -R "$fixture/." "$tmp/$site/"
            case "$TARGET" in
              aarch64-linux-musl)
                (cd "$tmp/$site" && qemu-aarch64 "$bin" build)
                ;;
              *)
                (cd "$tmp/$site" && "$bin" build)
                ;;
            esac
            diff -ru "tests/expected/$site" "$tmp/$site/public"
          done

      - name: Verify archive contents
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          root="sosig-$VERSION-$TARGET"
          archive="build/$PRESET/$root.tar.gz"
          tar -tzf "$archive" > contents.txt
          grep -Fx "$root/bin/sosig" contents.txt
          grep -Fx "$root/share/doc/sosig/README.md" contents.txt
          grep -Fx "$root/share/doc/sosig/LICENSE.txt" contents.txt
          grep -Fx "$root/share/doc/sosig/THIRD_PARTY_NOTICES.md" contents.txt

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          tar -C "$tmp" -xzf "$archive" "$root/bin/sosig"
          case "$TARGET" in
            aarch64-macos)
              if nm "$tmp/$root/bin/sosig" |
                awk 'NF >= 3 && $2 ~ /^[a-z]$/ { found = 1 } END { exit(found ? 0 : 1) }'
              then
                echo "packaged Mach-O binary still carries local symbols" >&2
                exit 1
              fi
              ;;
            *)
              if file "$tmp/$root/bin/sosig" | grep -q "not stripped"; then
                echo "packaged ELF binary still carries its symbol table" >&2
                exit 1
              fi
              ;;
          esac

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: build/${{ matrix.preset }}/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - package
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET_COUNT: ${{ needs.resolve.outputs.target_count }}
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          archives=(sosig-"$VERSION"-*.tar.gz)
          if [ "${#archives[@]}" -ne "$TARGET_COUNT" ]; then
            echo "expected $TARGET_COUNT release archives, found ${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          sha256sum -- "${archives[@]}" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --clobber \
              artifacts/*.tar.gz \
              artifacts/SHA256SUMS
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --verify-tag \
              artifacts/*.tar.gz \
              artifacts/SHA256SUMS
          fi
